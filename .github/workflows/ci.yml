name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository sanity check
        run: |
          test -f README.md
          test -f LICENSE
          echo "Minimal CI passed"
