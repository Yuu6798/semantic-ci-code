name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q --cov=src/semantic_ci_code --cov-report=term

      - name: Security audit
        # Audit the project's declared dependencies only (pip-audit resolves
        # pyproject.toml in an isolated env), not the runner's active Python
        # environment. The runner image's bundled tooling (pip, setuptools,
        # wheel, etc.) varies by Python version and image refresh date and is
        # outside this repo's responsibility, so a bare ``pip-audit`` would
        # fail on host-system CVEs unrelated to our deps.
        run: pip-audit --strict .
