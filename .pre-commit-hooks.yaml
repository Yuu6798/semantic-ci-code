- id: semantic-ci
  name: semantic-ci
  description: Run Semantic CI against staged Python changes
  entry: semantic-ci check --candidate-source=staged-index
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: semantic-ci-smoke
  name: semantic-ci smoke
  description: Run Semantic CI smoke mode against staged Python changes
  entry: semantic-ci check --candidate-source=staged-index --mode smoke
  language: python
  pass_filenames: false
  stages: [pre-commit]
