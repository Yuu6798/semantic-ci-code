# Python standard library known-effect signatures (P1 seed).
#
# Mapped to docs/code_semantic_ci_design.md §7.4. ``global_mutation`` is
# intentionally absent: it is a statement-level concern (``global`` /
# ``nonlocal`` / module-level rebinding) rather than a call signature,
# and is left to a dedicated extractor pass.
#
# In P1 the python_effect_extractor only resolves ``direct_call``
# patterns (``ast.Name`` and dotted ``ast.Attribute`` chains rooted in
# an ``ast.Name``). Entries describing method calls on instances (e.g.
# ``pathlib.Path.read_text``) are kept here so future resolution levels
# can reuse the same database without schema changes.

effects:
  # ---------------------------------------------------------------- fs
  - id: builtin_open
    language: python
    match:
      call: open
    effect: fs
    access: unknown
    severity: medium

  - id: pathlib_path_open
    language: python
    match:
      call: pathlib.Path.open
    effect: fs
    access: unknown
    severity: medium

  - id: pathlib_path_read_text
