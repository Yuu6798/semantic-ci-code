[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-ci-code"
version = "0.1.0"
description = "Deterministic semantic CI layer for code changes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yuu6798"}]
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0,<5.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=7.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<1.0",
]

[project.scripts]
semantic-ci-code = "semantic_ci_code.__main__:main"
semantic-ci = "semantic_ci_code.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"semantic_ci_code.schemas" = ["*.json"]
"semantic_ci_code.effects" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/semantic_ci_code"]
branch = true

[tool.coverage.report]
# Branch coverage on current main measures 72.81%. fail_under is held
# just below that (~3pp margin) to gate against significant regressions
# while leaving room for normal fluctuation. Raise the floor as coverage
# improves rather than letting the gate erode silently.
fail_under = 70
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/pipeline/syntax_error/bad.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
